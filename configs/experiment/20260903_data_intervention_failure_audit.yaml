        transition_right_outer: {patch_start_x_m: 0.334, patch_width_m: 0.779, patch_exit_x_m: 1.113}
        transition_right_inner: {patch_start_x_m: 0.344, patch_width_m: 0.781, patch_exit_x_m: 1.125}
        concrete_0.25_left_a: {patch_start_x_m: 0.348, patch_width_m: 0.781, patch_exit_x_m: 1.129}
        concrete_0.25_left_b: {patch_start_x_m: 0.352, patch_width_m: 0.787, patch_exit_x_m: 1.139}
