outcome_classification:
  precedence:
    - PRETARGET_FALL
    - TARGET_FOLLOWING_FALL_CENSOR
    - OTHER_INVALID
    - STRICT_SAND_BENIGN
    - SUPPORT
    - SLIP
    - DUAL_HAZARD
  rules:
    PRETARGET_FALL: invalid_reason_equals_pretarget_fall
    TARGET_FOLLOWING_FALL_CENSOR: invalid_reason_equals_insufficient_post_target_observation
    OTHER_INVALID: remaining_invalid_record
    STRICT_SAND_BENIGN: valid_actual_STRICT_BENIGN
    SUPPORT: valid_actual_SUPPORT
    SLIP: valid_actual_SLIP
    DUAL_HAZARD: valid_actual_DUAL_HAZARD

post_target_taxonomy:
  requested_observation_ms: 1000
  precedence:
    - IMMEDIATE_TARGET_INDUCED_INSTABILITY
    - SHORT_LIVED_BENIGN_THEN_LATER_FALL
    - PHYSICALLY_VALID_TARGET_PERIOD_STRICT_LAST_CONTACT_RULE
    - TRUE_INSUFFICIENT_HORIZON
    - OTHER
  rules:
    IMMEDIATE_TARGET_INDUCED_INSTABILITY: fall_exists_and_fall_minus_first_target_lt_1000ms
    SHORT_LIVED_BENIGN_THEN_LATER_FALL: fall_exists_and_fall_minus_first_target_ge_1000ms
    PHYSICALLY_VALID_TARGET_PERIOD_STRICT_LAST_CONTACT_RULE: no_fall_and_censor_minus_first_target_ge_1000ms_and_post_last_target_lt_1000ms
    TRUE_INSUFFICIENT_HORIZON: no_fall_and_censor_minus_first_target_lt_1000ms
    OTHER: none_of_the_above

factor_region_categorization:
  denominator: all_planned_records_in_cell
  eligible_numerator: STRICT_SAND_BENIGN_plus_SUPPORT
  STABLE: eligible_rate_at_least_0.75
  MARGINAL: eligible_rate_at_least_0.50_and_below_0.75
  UNSTABLE: eligible_rate_below_0.50
  catastrophic_cell: eligible_rate_below_0.25

domain_comparison:
  inside: start_width_and_exit_all_inside_inclusive_proven_envelope_for_topology
  near_boundary: outside_at_most_one_bound_by_at_most_0.004m_and_not_inside
  outside: all_other_geometry
  support_and_moderate: compare_against_exact_historical_physical_control_family_not_mild_bounds

pilot_decision:
  maximum_new_simulations: 64
  maximum_batches: 2
  no_pilot_if_all_required:
    - one_mechanism_explains_at_least_0.80_of_invalid_runs
    - both_factor_manifolds_have_prior_viable_physical_evidence
    - every_required_source_speed_cell_has_prior_viable_physical_evidence
    - fresh_nonoverlapping_redesign_coordinates_fit_inside_a_justified_envelope
  pilot_required_if_any:
    - more_than_0.20_of_invalid_runs_are_inside_the_applicable_viable_domain
    - no_fresh_nonoverlapping_coordinates_fit_inside_the_justified_envelope
    - an_intended_source_speed_factor_cell_lacks_viable_adverse_or_comparison_coverage
  pilot_batches:
    - batch: 1
      config_path: configs/experiment/20260903_sand_factor_conditioned_physical_domain_calibration.yaml
