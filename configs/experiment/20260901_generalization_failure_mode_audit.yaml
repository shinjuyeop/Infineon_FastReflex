audit_questions:
  - id: delayed_ice_premature
    question: Are premature Ice alerts aligned to an early physical precursor or a benign low-friction transition?
  - id: delayed_sand_early
    question: Are delayed-Sand Reflexes about 550 ms before I1 aligned to a new physical precursor or a benign staged transition?
  - id: right_support_miss
    question: Does the right-only Support 0/4 result indicate Pelvis-IMU observability limits or side distribution shift/model failure?
  - id: speed_degradation
    question: Is 0.20/0.30 m/s degradation primarily a speed-domain dependency or another correlated factor?

