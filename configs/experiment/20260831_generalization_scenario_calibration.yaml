execution_policy:
  calibration_evidence: simulator_physical_only
  model_blind_selection: true
  model_outputs_forbidden_until_selection_freeze: true
  forbidden_selection_inputs:
    - hazard_probability
    - reflex_required
    - terrain_prediction
    - terrain_probability
    - frozen_model_success_or_failure
  no_retraining: true
  no_full_dataset_generation: true
  no_threshold_search: true
  no_normalizer_refit: true
  no_checkpoint_write: true
  no_current_dataset_rewrite: true
  no_current_holdout_access: true
  current_holdout_waveform_reopened: false
  current_holdout_new_inference: false

physical_semantics:
  slip:
    observable: touchdown_anchor_tangential_foot_drift_m
    threshold_m: 0.050
    persistence_ms: 3
  support:
    observable: support_surface_spread_m
    threshold_m: 0.010
    persistence_ms: 20
    reset: contact_episode_change_or_fall_censor
  i1:
    observable: positive_loaded_foot_spread_derivative_1ms
    threshold: 0.0
    persistence_ms: 20
  clean_target_touchdown:
    exact_terrain_identity_required: true
    persistent_window_ms: 50
    mixed_contact_ratio_max_exclusive: 0.20
  gait_phase:
    reference: first_established_physical_hazard
    edge_lookback_inclusive_ms: 10
    priority: [TOUCHDOWN_LOADING, CONTACT_RELEASE, DOUBLE_SUPPORT, LEFT_SINGLE_SUPPORT, RIGHT_SINGLE_SUPPORT, NO_SUPPORT]

common_viability:
  finite_runtime_required: true
  target_contact_required: true
  normal_prefix_ms_min: 500
  pretransition_fall_max: 0
  physical_signature_unique_required: true
  classifications:
    - VIABLE_AS_DESIGNED
    - PHYSICAL_OUTCOME_MISMATCH
    - PRETRANSITION_FALL
    - NO_TARGET_CONTACT
    - TIMING_ORDER_MISMATCH
    - SIDE_MISMATCH
    - NONFINITE

selection:
  evidence: physical_only
  priority:
    - family_semantics_satisfied
    - no_invalid_or_pretransition_fall
    - required_timing_relation_satisfied
    - intended_side_relation_satisfied
    - unique_physical_signature
    - parameter_diversity
  tie_break: deterministic_lexicographic_pilot_id
  selection_may_change_after_model_smoke: false
  round_1_grid_frozen_before_simulation: true
  round_2_status: NOT_AUTHORIZED_IN_THIS_CONFIG

pilot_signature_exclusion:
  all_calibration_pilot_signatures_excluded_from_future_evaluation: true
  required_intersection_with_future_dataset: 0
  signature_fields:
    - source_terrain
    - target_terrain
    - speed_mps
    - patch_start_x_m
    - patch_width_m
    - slip_pattern
    - sink_pattern
    - sink_severity
    - support_pattern

