analysis:
  population: strict_confirmed_benign_sand_versus_actual_valid_support_controls
  balancing: one_anchor_and_one_vector_per_run
  anchors:
    benign:
      selection: earliest_sample_maximizing_trailing_20ms_RMS_pelvis_acceleration_deviation
      candidate_interval: first_target_contact_through_500ms_after_last_pre_censor_target_contact
      precontact_baseline: mean_acceleration_over_up_to_200ms_immediately_before_first_target_contact
      model_probability_used: false
    support: frozen_manifest_I1_first_sample
    support_established_secondary: frozen_manifest_established_Support_first_sample
  pelvis:
    representations:
      current_80d: frozen_final_v2_normalized_causal_80D_at_anchor
      flattened_window: frozen_final_v2_normalized_trailing_20x80_at_anchor
    decision_representation: flattened_window
  distance_normalization:
    method: Discovery_pooled_per_dimension_mean_and_population_standard_deviation
    epsilon: 1.0e-8
    refit_on_confirmation: forbidden
  metrics:
    centroid_separation: Euclidean_centroid_distance_divided_by_sqrt_of_balanced_mean_class_centroid_squared_distance
    nearest_neighbor: leave_one_run_out_Euclidean_balanced_class_accuracy_stable_index_tie_break
    ratio: mean_of_class_medians_of_nearest_opposite_divided_by_nearest_same_distance
    mixing: balanced_mean_opposite_class_fraction_among_five_nearest_other_runs
    radius: mean_of_Sand_in_Support_and_Support_in_Sand_95pct_own_centroid_radius_inclusion
    pairwise_quantiles: p05_p25_median_p75_p95_for_within_Sand_within_Support_and_between
    pca: full_SVD_with_largest_absolute_loading_positive_and_95pct_projection_interval_Jaccard_overlap
  realizable_fsr_contact:
    window_ms: 20
    vector:
      - FSR8_per_channel_mean_max_population_std_and_endpoint_delta
      - bilateral_load_imbalance_mean_population_std_and_current
      - per_foot_FSR_sum_greater_than_zero_contact_fraction_and_current
    dimension: 39
    exact_loaded_contact_included: false
    exact_support_spread_included: false
    representations: [FSR_contact_only, pelvis_window_plus_FSR_contact]
    no_classifier_or_probe: true
  privileged_oracle:
    vector:
      - per_foot_support_spread_mean_max_current
      - per_foot_transition_displacement_mean_max_current
      - exact_loaded_contact_fraction_and_current
    dimension: 16
    reported_separately: true
    runtime_or_sensor_claim: prohibited
  descriptive_factors:
    - source
    - speed
    - transition_topology
    - actual_entry_phase
    - actual_severity
    - entry_timing_stratum
    - exposure_stratum
  frozen_factor_definitions:
    start_stratum_m: {EARLY: "x < 0.305", MID: "0.305 <= x < 0.355", LATE: "x >= 0.355"}
    width_stratum_m: {NARROW: "w < 0.695", MEDIUM: "0.695 <= w < 0.760", WIDE: "w >= 0.760"}
    entry_timing_ms: {EARLY: "t < 2500", MID: "2500 <= t < 4500", LATE: "t >= 4500"}
    exposure_source: mild_cumulative_loaded_sand_exposure_else_target_contact_duration_before_censor
    exposure_ms: {LOW: "t < 2800", MID: "2800 <= t < 3600", HIGH: "t >= 3600"}

decision:
  adverse_margin: reflex_or_max_probability_at_least_0.95
  systematic_adverse:
    overall_fraction_min: 0.20
    both_sources_with_at_least_two_adverse_each: true
    at_least_two_speeds_with_at_least_two_adverse_each: true
  metadata_localization:
    factors: [speed, start_stratum, width_stratum, transition_topology, actual_entry_phase, actual_severity]
    adverse_fraction_range_min: 0.25
    cramers_v_min: 0.20
    minimum_valid_runs_per_level: 8
    both_thresholds_required_for_one_factor: true
  reasonable_pelvis_separation:
    all_required:
      centroid_separation_min: 0.75
      balanced_5nn_agreement_min: 0.80
      local_mixing_max: 0.30
      distance_ratio_min: 1.25
  strong_pelvis_mixing:
    at_least_three_required:
      centroid_separation_max: 0.60
      balanced_5nn_agreement_max: 0.70
      local_mixing_min: 0.40
      distance_ratio_max: 1.10
      radius_inclusion_min: 0.75
  realizable_fsr_material_increment:
    at_least_three_required:
      centroid_separation_delta_min: 0.25
      balanced_5nn_agreement_delta_min: 0.10
      local_mixing_delta_max: -0.15
      distance_ratio_delta_min: 0.20
    no_directional_metric_degradation_more_than: 0.05
    comparison: pelvis_window_plus_FSR_contact_minus_pelvis_window
  hypothesis_rules:
    DOMAIN_DIVERSITY_GAP_SUPPORTED: [prerequisites, systematic_adverse, metadata_localization, reasonable_pelvis, no_material_FSR_increment]
    PELVIS_OBSERVABILITY_TENSION_SUPPORTED: [prerequisites, systematic_adverse, no_metadata_localization, strong_pelvis_mixing, material_FSR_increment]
    MODEL_REPRESENTATION_OR_CAPACITY_TENSION_SUPPORTED: [prerequisites, systematic_adverse, no_metadata_localization, reasonable_pelvis, no_material_FSR_increment]
    SAND_GENERALIZATION_STUDY_INCONCLUSIVE: prerequisites_fail_or_no_unique_rule_matches
  unique_match_required: true
  no_post_replay_rule_change: true

margin_bins:
  mutually_exclusive_precedence:
    - REFLEX
    - GE_0.99_STREAK_LT_5MS
    - "[0.95,0.99)"
    - "[0.90,0.95)"
    - LT_0.90

