  date: 2026-08-27
  dataset_id: hazard_sensor_pilot_20260827
  schema_version: hazard_dataset_contract_v2
  purpose: test whether idealized bilateral virtual FSR improves early Sink observability

source:
  simulator_config: configs/simulator/g1.yaml
  dataset_config: configs/dataset/hazard.yaml
  baseline_dataset: data/raw/hazard_pilot_20260827
