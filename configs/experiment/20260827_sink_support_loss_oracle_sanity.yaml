experiment:
  id: SINK_SUPPORT_LOSS_ORACLE_SANITY
  date: 2026-08-27
  purpose: validate a causal contact-episode support-loss Sink oracle

source:
  simulator_config: configs/simulator/g1.yaml
  previous_experiment: configs/experiment/20260827_sink_physical_hazard_redefinition.yaml
  policy_sha256: 2a66ca6336eadb3c0b34b557763f3e06d01ff8fcf6260dd4cedbd69d6093fc28
  historical_sink_contract: SINK_HAZARD_CRITERIA_FROZEN

common:
  duration_s: 8.0
  physics_timestep_s: 0.0005
  sensor_rate_hz: 1000
  initial_condition: canonical_fixed_stand
  patch_start_x_m: 0.35
  patch_width_m: 0.75
  headless: true
  simulator_deterministic: true
  random_seed: null

support_loss_oracle:
  quadrant_order: [front_left, front_right, rear_left, rear_right]
  quadrant_supported: contact_present_and_normal_load_gte_cutoff
  quadrant_load_cutoff_n: 2.5
  foot_load_hysteresis_n: {on: 5.0, off: 2.5}
  touchdown_transient_ms: 10
  baseline_window_ms: 20
  baseline_aggregation: support_presence_ratio_gte_0_5
  baseline_presence_ratio: 0.5
  minimum_baseline_supported_quadrants: 2
  primary_metric: one_minus_retained_baseline_quadrant_count_ratio
  support_loss_ratio_threshold: 0.5
  persistence_ms: 20
  current_total_load_minimum_baseline_ratio: 0.3
  reset_on:
    - foot_leaves_loaded_contact
    - contact_episode_change
    - fall_or_censor
    - new_touchdown_episode
  future_outcome_dependency: false
  terrain_or_scenario_label_dependency: false
  fsr_or_imu_label_dependency: false
  tuning_after_results: prohibited
  freeze_status: criterion_not_freezable

secondary_diagnostics:
  weighted_support_loss:
    definition: one_minus_retained_baseline_median_quadrant_load_weight
    oracle_input: false
  support_contact_area_proxy:
    definition: retained_exact_contact_quadrant_occupancy
    oracle_input: false
  support_penetration_spread_m:
    status: preserved_failed_candidate
    threshold_m: 0.023655311971902848
    persistence_ms: 20

provisional_acceptance:
  benign_firing_max: 0
  uneven_detection_min: 9
  uneven_run_count: 12
  left_detection_min: 4
  left_run_count: 6
  right_detection_min: 4
  right_run_count: 6
  per_pattern_detection_min: 2
  per_pattern_run_count: 4
  each_speed_requires_detection: true
  causal_no_future_dependency: true

runs:
  - {id: concrete_s015, role: benign, terrain: concrete, speed_mps: 0.15, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: concrete_s025, role: benign, terrain: concrete, speed_mps: 0.25, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: marble_s015, role: benign, terrain: marble, speed_mps: 0.15, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: marble_s025, role: benign, terrain: marble, speed_mps: 0.25, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: uniform_sand_s015, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: uniform_sand_s025, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: balanced_left_mild_s015, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: transition_left, sink_severity: mild, support_pattern: balanced_soft}
  - {id: balanced_left_mild_s025, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: mild, support_pattern: balanced_soft}
  - {id: balanced_right_mild_s015, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: mild, support_pattern: balanced_soft}
  - {id: balanced_right_mild_s025, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: transition_right, sink_severity: mild, support_pattern: balanced_soft}
  - {id: balanced_left_moderate_s015, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: transition_left, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: balanced_left_moderate_s025, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: balanced_right_moderate_s015, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: balanced_right_moderate_s025, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: transition_right, sink_severity: moderate, support_pattern: balanced_soft}
  - {id: medial_left_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_left, sink_severity: severe, support_pattern: medial_soft}
  - {id: medial_left_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: severe, support_pattern: medial_soft}
  - {id: medial_right_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: severe, support_pattern: medial_soft}
  - {id: medial_right_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_right, sink_severity: severe, support_pattern: medial_soft}
  - {id: lateral_left_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_left, sink_severity: severe, support_pattern: lateral_soft}
  - {id: lateral_left_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: severe, support_pattern: lateral_soft}
  - {id: lateral_right_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: severe, support_pattern: lateral_soft}
  - {id: lateral_right_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_right, sink_severity: severe, support_pattern: lateral_soft}
  - {id: localized_left_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_left, sink_severity: severe, support_pattern: localized_soft}
  - {id: localized_left_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: severe, support_pattern: localized_soft}
  - {id: localized_right_s015, role: uneven, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: severe, support_pattern: localized_soft}
  - {id: localized_right_s025, role: uneven, terrain: sand, speed_mps: 0.25, sink_pattern: transition_right, sink_severity: severe, support_pattern: localized_soft}

outcome_audit:
  posture_degradation: historical_frozen_t2_diagnostic_only
  fall: censor_diagnostic_only
  recovery: support_loss_detected_without_fall

fsr_descriptive_audit:
  enabled_only_if_oracle_supported: true
  horizons_ms: [0, 20, 50, 100]
  training: false

artifacts:
  path: artifacts/runs/20260827_sink_support_loss_oracle_sanity
  gitignored: true
  committed: false

report:
  path: reports/20260827_sink_support_loss_oracle_sanity.md
