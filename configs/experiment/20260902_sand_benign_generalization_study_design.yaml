observability_metrics:
  analysis_population: strict_confirmed_benign_sand_versus_actual_valid_support_controls
  anchor_selection:
    benign: earliest_sample_maximizing_20ms_trailing_RMS_pelvis_acceleration_deviation_within_target_contact_through_500ms_after_last_target_contact
