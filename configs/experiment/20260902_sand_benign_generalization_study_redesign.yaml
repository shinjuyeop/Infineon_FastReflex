schema_version: 1

experiment:
  id: SAND_BENIGN_GENERALIZATION_STUDY_REDESIGN
  status: SAND_BENIGN_GENERALIZATION_STUDY_REDESIGN_READY
  scientific_question: does_the_frozen_v2_failure_on_fresh_physically_viable_sand_benign_generalize_across_source_speed_boundary_severity_and_contact_context
  evidence_type: future_development_study_not_a_new_final_holdout

dataset_plan:
  dataset_id: sand_benign_generalization_redesigned_study_20260902
  dataset_path: data/raw/sand_benign_generalization_redesigned_study_20260902
  simulation_duration_s: 9.0
  physics_timestep_s: 0.0005
  sensor_rate_hz: 1000
  model_blind_generation: true
  generate_in_this_milestone: false
  failed_study_runs_are_calibration_only: true
  pilot_runs_are_calibration_only: true

physical_domain_rationale:
  pretarget_fall: late_entry_exceeded_hard_ground_survival_for_some_low_speed_cycles
  posttarget_failure: broad_unconditioned_geometry_and_severe_65mm_compliance_caused_long_exposure_fall_or_slip
  phase_collapse: touchdown_sample_phase_was_structurally_double_support_and_not_a_valid_phase_control_measure
  cohort_failure: cohort_identifier_did_not_change_any_simulator_state
  support_underreporting: all_posttarget_falls_were_invalidated_even_after_support_was_established_and_observed
  calibrated_changes:
    - use_9s_duration_while_preserving_1000ms_followup
    - narrow_geometry_around_physically_verified_entry_and_exit_regions
    - condition_geometry_on_source_speed_only_for_equivalent_physical_viability
    - measure_phase_20ms_before_contact_and_do_not_claim_direct_ABCD_control
    - replace_identifier_cohorts_with_predeclared_geometry_realizations
    - use_moderate_as_boundary_adjacent_maximal_calibrated_benign_tier
    - exclude_severe_from_benign_because_0_of_36_calibration_runs_were_strict
    - use_separate_known_good_support_control_geometry

parameter_domain:
  source_terrain: [concrete, marble]
  speed_mps: [0.20, 0.25, 0.30]
  target_terrain: sand
  broad_benign:
    sink_severity: mild
    expected_displacement_m: approximately_0.020
    topology: [transition_left, transition_right]
  near_hazard_benign:
    semantics: boundary_adjacent_maximal_calibrated_strict_benign_mechanics
    sink_severity: moderate
    expected_displacement_m: approximately_0.040
    justification: next_discrete_severe_tier_approximately_0.065m_produced_0_of_36_strict_benign_in_calibration
    claim_limit: not_equivalent_to_historical_0.0525m_near_hazard_stratum
  excluded_from_benign:
    sink_severity: severe
    reason: physically_unreliable_under_wide_and_short_exposure_geometries
  phase:
    measure: exact_loaded_contact_phase_20ms_before_first_censor_valid_target_contact
    categories: [LEFT_SINGLE_SUPPORT, RIGHT_SINGLE_SUPPORT]
    contact_sample_phase_reported_separately: true
    phase_assignment_control: none
  geometry:
    method: source_speed_conditioned_anchor_plus_predeclared_small_offsets
    conditioning_target: physical_validity_and_equivalent_compliance_not_model_behavior
    maximum_start_m: 0.354
    minimum_start_m: 0.305
    minimum_width_m: 0.666
    maximum_width_m: 0.834
  support_controls:
    ordinary: lateral_deformable_with_separate_left_right_anchor_domain
    delayed: staged_lateral_deformable_left_only_canonical_mechanics

