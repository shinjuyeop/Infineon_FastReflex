schema_version: 1

experiment:
  id: FULL_STATE_STABILITY_GROUND_TRUTH_SANITY
  date: 2026-08-28
  timezone: Asia/Seoul
  source_commit_at_start: 2940c68a58ccb6b132b9be0f316f4fd905949d05
  origin_main_at_start: 2940c68a58ccb6b132b9be0f316f4fd905949d05
  worktree_clean_at_start: true
  purpose: validate a privileged stable-distribution distance clock without tuning the retired MoS scalar

source:
  simulator_config: configs/simulator/g1.yaml
  policy_path: artifacts/external/unitree_g1/g1_velocity_policy.onnx
  policy_sha256: 2a66ca6336eadb3c0b34b557763f3e06d01ff8fcf6260dd4cedbd69d6093fc28
  calibration_scenario_config: configs/experiment/20260828_walking_stability_ground_truth_sanity.yaml
  retired_mos_report: reports/20260828_walking_stability_ground_truth_sanity.md

common:
  duration_s: 8.0
  physics_timestep_s: 0.0005
  sensor_rate_hz: 1000
  minimum_normal_prefix_ms: 500
  minimum_post_contact_ms: 500
  terrain_identity_input: false
  future_state_input: false
  result_driven_feature_addition: prohibited
  result_driven_threshold_tuning: prohibited

phase_conditioning:
  phases: [LEFT_SINGLE_SUPPORT, RIGHT_SINGLE_SUPPORT, DOUBLE_SUPPORT]
  source: exact_loaded_contact
  no_support: diagnostic_only
  runtime_input: false

candidate_definitions:
  PELVIS_STATE:
    simplicity_rank: 0
    feature_order:
      - pelvis_roll_rad
      - pelvis_pitch_rad
      - pelvis_angular_velocity_x_rad_s
      - pelvis_angular_velocity_y_rad_s
      - pelvis_angular_velocity_z_rad_s
      - pelvis_linear_velocity_x_m_s
      - pelvis_linear_velocity_y_m_s
      - pelvis_linear_velocity_z_m_s
      - pelvis_height_m
  LOWER_BODY_STATE:
    simplicity_rank: 1
    authoritative_joint_order:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    feature_order:
      - left_hip_pitch_joint_q_rad
      - left_hip_pitch_joint_dq_rad_s
      - left_hip_roll_joint_q_rad
      - left_hip_roll_joint_dq_rad_s
