dataset:
  name: hazard
  schema_version: hazard_dataset_contract_v1

sensor:
  type: pelvis_imu_6axis
  sample_rate_hz: 1000
  frame: pelvis_imu_site_local
  dtype: float32
  timestamp_unit: us
  channels:
    - accel_x
    - accel_y
    - accel_z
    - gyro_x
    - gyro_y
    - gyro_z

task:
  classes:
    - {id: 0, name: NORMAL}
    - {id: 1, name: SLIP}
    - {id: 2, name: SINK}

windows:
  candidate_ms: [20, 30, 50, 100]

preprocessing:
  type: raw
  optional_normalization: per_channel_mean_std_from_train_split_only

splitting:
  strategy: run_disjoint_group_aware

labels:
  dual_hazard_policy: preserve_raw_exclude_from_v1_train_and_evaluation
  early_interval_policy: preserve_diagnostics_exclude_until_validated
  physical_load:
    on_threshold_n: 5.0
    off_threshold_n: 2.5
    touchdown_transient_ms: 10
  established_slip:
    touchdown_anchor_drift_m: 0.050
    persistence_ms: 3
  sink_physical:
    first_loaded_penetration_change_m: 0.0055
    persistence_ms: 20
    role: precursor_diagnostic_only
  sink_hazard:
    criteria_status: SINK_HAZARD_CRITERIA_FROZEN
    requires_physical_sink: true
    requires_meaningful_locomotion_or_posture_degradation: true
    pelvis_tilt_threshold_rad: 0.04454633221030235
    persistence_ms: 20
    effect_onset: first_persistent_threshold_sample
    hazardous_episode_early_detection_reference: sink_physical_onset_t1
    t1_to_t2_interval_training_eligible: false

provenance:
  required_fields:
    - dataset_id
    - schema_version
    - generator_version
    - source_commit
    - created_at
    - sample_rate_hz
    - channel_order
