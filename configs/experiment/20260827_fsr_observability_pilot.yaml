  require_clean_worktree: true

output:
  root: data/raw
  fail_if_exists: true
  storage_format: npz_per_complete_run

common:
  duration_s: 8.0
  patch_width_m: 0.75
  headless: true
  simulator_deterministic: true
  policy_sha256: 2a66ca6336eadb3c0b34b557763f3e06d01ff8fcf6260dd4cedbd69d6093fc28

sensor:
  sample_rate_hz: 1000
  foot_fsr_unit: N
  foot_fsr_channels:
