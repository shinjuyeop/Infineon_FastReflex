    - left_front_right
    - left_rear_left
    - left_rear_right
    - right_front_left
    - right_front_right
    - right_rear_left
    - right_rear_right
  profiles:
    imu6: [pelvis_imu]
    fsr8: [foot_fsr]
    fusion14: [pelvis_imu, foot_fsr]

