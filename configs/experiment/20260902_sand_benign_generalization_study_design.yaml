    distance_features: discovery_pooled_per_dimension_mean_and_standard_deviation_with_epsilon_1e-8_then_frozen_for_confirmation
    fsr_features: discovery_pooled_per_dimension_mean_and_standard_deviation_with_epsilon_1e-8_then_frozen_for_confirmation
    confirmation_refit: forbidden
  model_independent_metrics:
    - within_group_RMS_normalized_centroid_separation
    - leave_one_run_out_balanced_1NN_and_5NN_group_agreement
    - nearest_opposite_to_nearest_same_distance_ratio
    - five_neighbor_opposite_class_mixing_fraction
    - bidirectional_95pct_centroid_radius_inclusion
    - deterministic_PCA_first_two_components_variance_and_class_projection_overlap
    - pairwise_within_and_between_class_distance_quantiles
  deterministic_PCA: full_SVD_with_component_sign_set_by_largest_absolute_loading_positive
  reasonable_pelvis_separation:
    all_required:
      centroid_separation_min: 0.75
      balanced_5NN_agreement_min: 0.80
      local_opposite_class_mixing_max: 0.30
      median_nearest_opposite_to_same_ratio_min: 1.25
  strong_pelvis_mixing:
    at_least_three_required:
      centroid_separation_max: 0.60
      balanced_5NN_agreement_max: 0.70
      local_opposite_class_mixing_min: 0.40
      median_nearest_opposite_to_same_ratio_max: 1.10
      bidirectional_95pct_radius_inclusion_min: 0.75
  realizable_fsr_material_increment:
    at_least_three_required:
      centroid_separation_delta_min: 0.25
      balanced_5NN_agreement_delta_min: 0.10
      local_opposite_class_mixing_delta_max: -0.15
      median_nearest_opposite_to_same_ratio_delta_min: 0.20
    no_metric_degradation_more_than: 0.05
  privileged_oracle_reported_separately: true
  no_probe_or_production_classifier_training: true
  no_sensor_selection_from_privileged_oracle: true

