    last_sand_clock: last_sample_where_frozen_global_output_equals_sand
    context: current_sand_or_elapsed_since_last_sand_at_most_grace
    reset: [simulation_reset, explicit_censor, grace_expiry]
    non_sand_update_immediate_reset: false
    grace_sweep: prohibited
  F2:
    name: SUPPORT_FOOT_TERRAIN_MEMORY
    availability_requires:
      - frozen_prediction_foot_identity
      - frozen_per_foot_update_provenance
      - canonical_runtime_supporting_foot_state
