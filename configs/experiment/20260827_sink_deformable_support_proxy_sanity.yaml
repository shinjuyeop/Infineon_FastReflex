  - {id: balanced_moderate_left_s025, group: balanced_benign, role: benign, terrain: sand, speed_mps: 0.25, sink_pattern: transition_left, sink_severity: moderate, support_pattern: balanced_deformable}
  - {id: balanced_moderate_right_s015, group: balanced_benign, role: benign, terrain: sand, speed_mps: 0.15, sink_pattern: transition_right, sink_severity: moderate, support_pattern: balanced_deformable}
