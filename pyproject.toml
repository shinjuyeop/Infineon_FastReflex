[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infineon-fastreflex"
version = "0.0.0"
description = "Research workspace for FastReflex hazard classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3,<4",
  "matplotlib>=3.5",
  "numpy>=1.23",
  "onnxruntime>=1.16",
  "PyYAML>=6",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fastreflex.simulation" = [
  "assets/unitree_g1/*.xml",
  "assets/unitree_g1/*.md",
  "assets/unitree_g1/LICENSE",
  "assets/unitree_g1/meshes/*.STL",
]
