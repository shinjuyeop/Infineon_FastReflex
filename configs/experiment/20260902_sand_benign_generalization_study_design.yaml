    - no_scenario_parameter_or_model_change_after_discovery
  confirmation_hypothesis_replacement_after_open: forbidden
  confirmation_model_tuning: forbidden

physical_label_contract:
  authority: actual_frozen_physical_oracle_not_design_intent
  strict_confirmed_benign:
    all_required:
      - target_sand_contact_reached
      - no_established_Slip
      - no_I1_activation
      - no_established_Support
      - no_fall_or_censor_ambiguity_in_target_observation
      - at_least_1000ms_observation_after_last_target_contact_or_transition_exit
      - finite_runtime_and_complete_required_diagnostics
    primary_specificity_eligible: true
  physically_benign_I1_only:
    all_required: [no_established_Slip, I1_activation, no_established_Support, adequate_followup]
    retained: true
    primary_specificity_eligible: false
    use: descriptive_near_support_continuum_only
  support_control:
    established_definition: support_spread_at_least_0.010m_for_20_consecutive_ms_with_contact_episode_reset
    I1: existing_frozen_causal_loaded_foot_spread_derivative_reference
    ordinary_required: I1_then_established_Support_and_no_Slip
    delayed_required: target_contact_then_two_clean_touchdowns_then_I1_then_established_Support_and_no_Slip
    anchor_or_target_redesign: forbidden
  slip_outcome:
    established_definition: frozen_0.050m_for_3_consecutive_ms
    retained_and_reclassified: true
    benign_denominator: false
  actual_benign_severity:
    measure: peak_absolute_target_balanced_plate_vertical_displacement_m_during_fully_observed_target_interval
    LOW: {minimum_inclusive: 0.0, maximum_exclusive: 0.030}
    MEDIUM: {minimum_inclusive: 0.030, maximum_exclusive: 0.0525}
    NEAR_HAZARD: {minimum_inclusive: 0.0525, maximum_inclusive: 0.070}
    boundary_rationale: midpoints_between_canonical_0.020_0.040_0.065m_travel_profiles_with_5mm_numeric_headroom
    additional_reported_diagnostics: [peak_support_spread, load_redistribution, transition_displacement, peak_absolute_FSR_load_derivative]
    intent_never_overrides_actual_stratum: true
  outcome_mismatch:
    retained_in_original_split: true
    reclassified_by_actual_outcome: true
    model_result_may_not_invalidate_run: true
  invalid_reasons:
    - nonfinite_or_unstable_simulation
    - pretarget_fall
    - target_scenario_never_reached
    - insufficient_post_target_observation
    - corrupt_or_malformed_file
    - required_sensor_or_diagnostic_drop
  model_false_positive_is_invalid: false

duplicate_and_diversity_policy:
  exact_signature_fields: [source_terrain, target_terrain, speed_mps, patch_start_x_m, patch_width_m, slip_pattern, sink_pattern, sink_severity, support_pattern]
  planned_internal_exact_duplicates_max: 0
  historical_exact_overlap_max: 0
  split_exact_overlap_max: 0
  historical_references: [unified_hazard_reflex_20260829, model_v2_hazard_reflex_20260901, generalization_hazard_reflex_20260831_all_metadata_only_for_consumed_holdout, ice_near_hazard_semantics_20260901]
  near_parameter_duplicate:
    comparison_scope: same_source_target_speed_slip_sink_severity_support_pattern
    patch_start_difference_m_exclusive: 0.002
    patch_width_difference_m_exclusive: 0.004
    split_overlap_max: 0
  post_generation_physical_signature:
    vector: [first_target_contact_ms, target_contact_duration_ms, leading_foot, entry_gait_phase, peak_transition_displacement_m, peak_support_spread_m, normalized_load_redistribution, normalized_peak_load_derivative, pelvis_accel_rms, pelvis_gyro_rms]
    normalization_scales: {entry_time_ms: 300, contact_duration_ms: 300, displacement_m: 0.020, support_spread_m: 0.010, load_redistribution_body_weight: 0.25, load_derivative_body_weight_per_s: 50, pelvis_accel_mps2: 9.80665, pelvis_gyro_radps: 1.0}
    near_duplicate_rule: same_source_speed_severity_topology_leading_foot_and_entry_phase_with_scaled_euclidean_distance_at_most_0.10
    waveform_hash_exact_duplicates_max: 0
    use_model_probability_or_success: false
  consumed_holdout_comparison: manifest_metadata_and_signature_only
  consumed_holdout_waveform_similarity: forbidden
  result_driven_deletion: forbidden

invalid_run_policy:
  retain_manifest_record: true
  deterministic_replacement: none
  adaptive_backfill: forbidden
