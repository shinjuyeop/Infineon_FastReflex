    pelvis_flattened_window:
      vector: frozen_final_v2_normalized_trailing_20x80_at_anchor
      dimensionality: 1600
    pelvis_plus_realizable_fsr:
      vector: pelvis_flattened_window_plus_trailing_20ms_FSR8_mean_max_std_delta_load_imbalance_and_FSR_derived_contact
      exact_contact_or_support_spread_included: false
    privileged_oracle:
      vector: support_spread_transition_displacement_and_exact_loaded_contact
