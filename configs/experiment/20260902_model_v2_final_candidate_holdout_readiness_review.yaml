future_primary_contract:
  implementation: fastreflex.evaluation.hazard.evaluate_hazard_replays
  metrics:
    - overall_hazard_recall
    - slip_hazard_recall
    - support_hazard_recall
    - primary_no_hazard_specificity
    - ice_benign_specificity
    - system_premature_run_rate
    - slip_latency_ms
    - support_precursor_latency_ms
    - support_established_latency_ms
  gates:
    overall_hazard_recall_min: 0.90
    slip_hazard_recall_min: 0.95
    support_hazard_recall_min: 0.85
    primary_no_hazard_specificity_min: 0.95
    ice_benign_specificity_min: 0.95
    system_premature_run_rate_max: 0.10
    slip_p95_latency_ms_max: 40
    support_p95_established_latency_ms_max: 50
  event_timing:
    slip_valid_window_ms: [-30, 40]
    support_valid_window: [I1, established_support_plus_50_ms]
    pre_i1_support_alert: premature
    no_hazard_any_reflex: false_positive
    first_premature_reflex_cannot_be_rescued: true
  physical_semantics:
    hazard: established_slip_OR_established_support
    slip: {drift_threshold_m: 0.050, persistence_ms: 3, aggregation: any_foot}
    support: {spread_threshold_m: 0.010, persistence_ms: 20}
    i1: {loaded_spread_derivative_threshold: 0.0, persistence_ms: 20}
    actual_outcome_over_design_intent: true
    terrain_is_hazard_gate: false

