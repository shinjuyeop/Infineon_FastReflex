    sand_benign_specificity_min: 0.95
    premature_event_run_rate_max: 0.05
    median_fusion_latency_ms_max: 20
    p95_fusion_latency_ms_max: 50
    context_suppression_rate_max: 0.05
    hard_ground_specificity_min: 0.95
  priority:
    - lower_context_suppression
    - higher_support_recall
    - higher_benign_specificity
    - lower_premature_rate
    - lower_p95_latency
    - simpler_runtime_state
    - shorter_bounded_memory
  near_tie:
    recall_percentage_points_max: 2
    specificity_percentage_points_max: 2
    p95_latency_ms_max: 5
