schema_version: 1

experiment:
  id: WALKING_STABILITY_GROUND_TRUTH_SANITY
  date: 2026-08-28
  timezone: Asia/Seoul
  source_commit_at_start: d7f846909ae4c5a3de7e24133b7d8b50513d4027
  origin_main_at_start: d7f846909ae4c5a3de7e24133b7d8b50513d4027
  worktree_clean_at_start: true
  milestone_scope: simulator_only_causal_stability_ground_truth

source:
  simulator_config: configs/simulator/g1.yaml
  policy_path: artifacts/external/unitree_g1/g1_velocity_policy.onnx
  policy_sha256: 2a66ca6336eadb3c0b34b557763f3e06d01ff8fcf6260dd4cedbd69d6093fc28
  transition_calibration_config: configs/experiment/20260828_transition_scenario_calibration.yaml
  transition_calibration_report: reports/20260828_transition_scenario_calibration.md

common:
  duration_s: 8.0
  physics_timestep_s: 0.0005
  sensor_rate_hz: 1000
  minimum_normal_prefix_ms: 500
  minimum_post_contact_ms: 500
  deterministic: true
  result_driven_scenario_mutation: prohibited

stability_oracle:
  role: privileged_simulator_only_ground_truth
  runtime_inputs: []
  forbidden_runtime_inputs: [COM, XCoM, support_polygon, raw_MoS, phase_normal_envelope, stability_residual, exact_contact, future_fall]
  metric: phase_normalized_dynamic_margin_of_stability
  xcom: COM_xy_plus_COM_velocity_xy_div_sqrt_g_over_h
  support_height: COM_z_minus_current_loaded_support_height
  support_polygon: convex_hull_of_current_loaded_named_sole_points
  phases: [LEFT_SINGLE_SUPPORT, RIGHT_SINGLE_SUPPORT, DOUBLE_SUPPORT]
  no_support: diagnostic_only_nan
  envelope_scope: terrain_agnostic_observed_stable_calibration_runs_only
  phase_lower_quantile: 0.005
  quantile_method: linear
  fixed_margin_m: 0.010
  persistence_ms: 20
  transition_gate: first_exact_target_contact
  pretransition_firing: diagnostic_false_instability
  future_fall_dependency: false
  threshold_sweep: prohibited
  post_validation_retuning: prohibited

