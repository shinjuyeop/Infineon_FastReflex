execution_policy:
  calibration_evidence: simulator_physical_only
  model_blind_selection: true
  model_outputs_forbidden_until_physical_selection_freeze: true
  forbidden_selection_inputs:
    - hazard_probability
    - reflex_required
    - hazard_confidence
    - terrain_prediction
    - terrain_probability
    - frozen_model_success_or_failure
  no_source_change_expected: true
  no_Ice_material_change: true
  no_controller_or_policy_change: true
  no_retraining: true
  no_architecture_search: true
  no_threshold_search: true
  no_normalizer_fit: true
  no_checkpoint_write: true
  no_current_dataset_rewrite: true
  no_current_holdout_access: true
  no_full_dataset_generation: true
  current_holdout_waveform_reopened: false
  current_holdout_new_inference: false

physical_semantics:
  terrain_identity_touchdown:
    helper: fastreflex.dataset.terrain.terrain_identity_touchdown
    definition: false_to_true_edge_of_exact_per_foot_Ice_contact
  physical_contact_episode:
    helper: fastreflex.simulation.hazards.PhysicalDiagnostics.contact_episode_id
    unit: per_foot_maximal_contiguous_physical_contact_episode
    start: first_sample_with_nonnegative_new_episode_id
    end: first_exclusive_sample_after_that_episode_id
    complete: end_is_strictly_before_fall_censor_and_episode_ends_by_contact_release
    target_membership: exact_Ice_contact_exists_inside_episode
    target_touchdowns: exact_Ice_identity_rising_edges_inside_episode
  qualifying_benign_target_episode:
    required:
      - complete_physical_contact_episode
      - exact_Ice_contact_exists
      - at_least_one_exact_Ice_identity_touchdown
      - established_Slip_false_for_that_foot_throughout_episode
      - episode_ends_before_fall_censor
      - finite_diagnostics
    max_drift_diagnostic: maximum_finite_touchdown_anchor_drift_inside_episode
    clean_50ms_target_window_required_for_delayed_family: false
  later_distinct_slip_episode:
    required:
      - established_Slip_onset_exists
      - Slip_onset_has_nonnegative_physical_contact_episode_id
      - exact_Ice_contact_was_seen_in_that_same_physical_episode_at_or_before_Slip
      - Slip_episode_start_is_at_or_after_qualifying_benign_episode_end
      - Slip_episode_is_not_the_qualifying_benign_episode
    affected_side: actual_frozen_oracle_only
  one_contact_delayed_acceptance:
    primary_unit: completed_benign_target_physical_contact_episode_count_before_distinct_Slip_episode
    minimum_complete_benign_episodes: 1
    minimum_delay_ms: null
    time_is_diagnostic_only: true
  clean_Ice_observation:
    helper: fastreflex.dataset.terrain.build_touchdown_event_rows
    exact_target_identity_required: true
    persistent_window_ms: 50
    mixed_contact_ratio_max_exclusive: 0.20
    must_end_before_fall_censor: true
  Ice_benign_acceptance:
    required:
      - valid_exact_Ice_contact
      - clean_50ms_Ice_observation_count_at_least_1
      - no_established_Slip
      - no_I1
      - no_established_Support
      - no_pretarget_fall
      - finite_runtime

outcome_classification:
  priority:
    - NONFINITE
    - NO_TARGET_CONTACT
    - PRETARGET_FALL
    - PHYSICAL_ORACLE_AMBIGUITY
    - ONE_CONTACT_DELAYED_SLIP_VIABLE
    - MULTI_CONTACT_DELAYED_SLIP_VIABLE
    - SAME_CONTACT_SLIP
    - IMMEDIATE_SLIP
    - ICE_BENIGN_VIABLE
    - NO_SLIP_NO_CLEAN_ICE_CONTACT
    - OTHER_PHYSICAL_MISMATCH
  definitions:
    ONE_CONTACT_DELAYED_SLIP_VIABLE: exactly_1_complete_benign_target_episode_before_distinct_Slip
    MULTI_CONTACT_DELAYED_SLIP_VIABLE: at_least_2_complete_benign_target_episodes_before_distinct_Slip
    SAME_CONTACT_SLIP: clean_50ms_Ice_opportunity_precedes_Slip_but_both_are_in_same_physical_contact_episode_and_no_prior_complete_benign_target_episode
    IMMEDIATE_SLIP: Slip_occurs_in_first_target_physical_contact_episode_without_prior_clean_50ms_opportunity
    ICE_BENIGN_VIABLE: Ice_benign_acceptance_is_satisfied_and_no_Slip_exists
    NO_SLIP_NO_CLEAN_ICE_CONTACT: no_Slip_and_no_clean_50ms_Ice_opportunity

