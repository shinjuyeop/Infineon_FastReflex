dataset:
  name: hazard
  schema_version: hazard_dataset_contract_v3
  compatible_historical_schemas:
    - hazard_dataset_contract_v1
    - hazard_dataset_contract_v2

sensor:
  type: candidate_runtime_sensor_profiles
  sample_rate_hz: 1000
  frame: pelvis_imu_site_local
  dtype: float32
  timestamp_unit: us
  pelvis_imu_channels:
    - accel_x
    - accel_y
    - accel_z
    - gyro_x
    - gyro_y
    - gyro_z
  foot_fsr_unit: N
  foot_fsr_frame: ankle_roll_link_sole_local
  foot_fsr_channels:
    - left_front_left
    - left_front_right
    - left_rear_left
    - left_rear_right
    - right_front_left
    - right_front_right
    - right_rear_left
    - right_rear_right
  profiles:
    imu6: [pelvis_imu]
    fsr8: [foot_fsr]
    fusion14: [pelvis_imu, foot_fsr]

task:
  classes:
    - {id: 0, name: NORMAL}
    - {id: 1, name: SLIP}
    - {id: 2, name: SINK}

storage:
  layout: one_complete_run_per_npz
  v1_runtime_fields: [sequence, timestamp_us, pelvis_imu, sample_valid, channel_valid]
  v2_candidate_runtime_fields: [sequence, timestamp_us, pelvis_imu, foot_fsr, sample_valid, channel_valid, fsr_valid]
  v3_runtime_fields: [sequence, timestamp_us, pelvis_imu, foot_fsr, sample_valid, channel_valid, fsr_valid]
  v3_simulator_only_diagnostics:
    - contact_episode_id
    - support_surface_displacement_m
    - support_surface_vertical_velocity_m_s
    - support_surface_cell_contact
    - support_surface_spread_m
    - deformable_patch_episode_active
    - deformable_sink_active
    - deformable_sink_onset
  diagnostic_role: simulator_only_not_runtime_input
  generated_root: data/raw

sample_annotation:
  excluded_unresolved_id: -1
  slip_class_start: established_any_slip_onset
  historical_sink_class_start: frozen_degradation_onset_t2
  deformable_observability_sink_class_start: deformable_sink_onset_s1
  deformable_observability_pre_d0_class: NORMAL
  deformable_observability_d0_to_s1_training_eligible: false
  deformable_observability_post_contact_episode: normal_reset
  deformable_observability_no_s1_valid_run: BENIGN
  post_censor_training_eligible: false

windows:
  candidate_ms: [20, 30, 50, 100]

preprocessing:
  type: raw
  optional_normalization: per_channel_mean_std_from_train_split_only

splitting:
  strategy: run_disjoint_group_aware

labels:
  dual_hazard_policy: preserve_raw_exclude_from_v1_train_and_evaluation
  early_interval_policy: preserve_diagnostics_exclude_until_validated
  physical_load:
    on_threshold_n: 5.0
    off_threshold_n: 2.5
    touchdown_transient_ms: 10
  established_slip:
    touchdown_anchor_drift_m: 0.050
    persistence_ms: 3
    primary_aggregation: any_foot
    per_foot_onset_role: diagnostic_only
  sink_physical:
    first_loaded_penetration_change_m: 0.0055
    persistence_ms: 20
    role: precursor_diagnostic_only
  sink_hazard:
    criteria_status: SINK_HAZARD_CRITERIA_FROZEN
    requires_physical_sink: true
    requires_meaningful_locomotion_or_posture_degradation: true
    pelvis_tilt_threshold_rad: 0.04454633221030235
    persistence_ms: 20
    effect_onset: first_persistent_threshold_sample
    hazardous_episode_early_detection_reference: sink_physical_onset_t1
    t1_to_t2_interval_training_eligible: false
  deformable_support_sink:
    criteria_status: SINK_DEFORMABLE_SUPPORT_PROXY_SUPPORTED_FOR_OBSERVABILITY_STUDY
    metric: support_surface_spread_m
    threshold_m: 0.010
    persistence_ms: 20
    onset: first_sustained_active_sample_s1
    d0: deformable_support_first_physical_contact
    reset: contact_episode_change_or_censor
    role: v3_label_and_diagnostic_only
    forbidden_runtime_dependencies: [imu, fsr, terrain, scenario, fall, old_t2]

provenance:
  required_fields:
    - dataset_id
    - schema_version
    - generator_version
    - source_commit
    - created_at
    - sample_rate_hz
    - channel_order
