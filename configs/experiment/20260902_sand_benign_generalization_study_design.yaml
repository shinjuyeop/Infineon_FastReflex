diversity_metrics:
  computed_before_model_replay: true
  parameter_coverage:
    planned_template_coverage_required: 1.0
    source_speed_cell_count_required: 6
    templates_per_source_speed_split_required: 12
    intended_severity_count_per_cell_split: {LOW: 4, MEDIUM: 4, NEAR_HAZARD: 4}
    intended_topology_count_per_cell_split: {transition_left: 6, transition_right: 6}
    entry_stratum_count_per_split_template_set: {EARLY: 4, MID: 4, LATE: 4}
