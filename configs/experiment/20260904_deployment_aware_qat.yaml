    - frozen_TRAIN_derived_int8_calibration_windows

fake_quantization:
  implementation: explicit_unrolled_pytorch_reset_after_gru_with_ste
  equation: n_plus_z_times_h_minus_n
  timesteps: 20
  projection_partition:
    block_width: 16
    blocks_per_gate: 2
    mathematical_change: none_projection_rows_only_partitioned
    provenance: e84_m3_1_train_selected_ptq_representation
  rounding: round_to_nearest_ties_to_even
  clamp: true
  input:
    dtype: int8
    qmin: -128
    qmax: 127
    scale: 0.03241445869207382
    zero_point: 0
    source_range_policy: frozen_train_absolute_p99
    source_bound: 4.132843623161313
  weights:
    dtype: int8
    qmin: -127
    qmax: 127
    scheme: symmetric_per_output_channel
    scale_policy: current_weight_max_abs_divided_by_127_each_forward
    zero_point: 0
  biases:
    dtype: int32
    scheme: per_output_channel_input_scale_times_weight_scale
    scale_policy: derived_from_quantized_linear_inputs_and_weights
  activations:
    dtype: int8
    qmin: -128
    qmax: 127
    scheme: affine_per_tensor
    range_policy: one_model_blind_minmax_observer_pass_on_all_2597_train_calibration_windows_before_optimizer_step_1
    observer_updates_during_training: false
    observer_scope: each_unrolled_timestep_and_partitioned_operation_output
  nonlinear:
    sigmoid: {scale: 0.00390625, zero_point: -128, qmin: -128, qmax: 127}
    tanh: {scale: 0.0078125, zero_point: 0, qmin: -128, qmax: 127}
    softmax: {scale: 0.00390625, zero_point: -128, qmin: -128, qmax: 127}
  recurrent_hidden:
    scheme: affine_per_tensor_per_unrolled_timestep
    feedback_uses_fake_quantized_hidden: true
  float_bypass:
    fake_quant_disabled: exact_explicit_float_equation
    parity_absolute_tolerance: 1.0e-6
    parity_relative_tolerance: 1.0e-6
  limitation: research_fake_quant_is_not_actual_tflite_or_vela_acceptance

objective:
  terms:
    supervised_inverse_frequency_cross_entropy:
      forward: fake_quant
      coefficient: 0.2
    teacher_logit_smooth_l1_fake_quant:
      teacher: exact_frozen_source_member
      coefficient: 1.0
    teacher_logit_smooth_l1_float_bypass:
      teacher: exact_frozen_source_member
      coefficient: 1.0
    teacher_hidden_mean_squared_error_fake_quant:
      teacher: exact_frozen_source_member_all_20_hidden_states
      coefficient: 0.25
  scientific_loss_redesign: false
  within_class_domain_balanced_loss_mass: false

training:
  initialization: exact_corresponding_frozen_round3_member
  seeds: [20260828, 20260829, 20260830]
  optimizer: Adam
  learning_rate: 0.0001
  weight_decay: 0.0
  batch_size: 128
  maximum_epochs: 12
  patience: 3
  epoch_selection: minimum_composite_objective_on_frozen_train_monitor
  shuffle: deterministic_each_epoch
  gradient_clipping: none
  fake_quant_active_from_optimizer_step: 1
  checkpoint_policy: one_best_train_monitor_checkpoint_per_seed
  architecture_search: false
  threshold_search: false
  persistence_search: false
  seed_search: false

pre_optimizer_gates:
  protocol_config_committed: true
  source_identity_verified: true
  architecture_verified: true
  normalizer_verified: true
  feature_schema_verified: true
  effective_train_verified: true
  calibration_verified: true
  protected_data_rejection_verified: true
  explicit_float_bypass_parity_verified: true
  activation_observers_frozen: true

train_only_acceptance:
  reference: exact_frozen_v2_float_member_and_ensemble
  comparisons:
    - original_weights_ptq_style_fake_quant
    - qat_weights_float_bypass
    - qat_weights_full_int8_fake_quant
  probability_contract:
    every_member_maximum_absolute_error_maximum: 0.10
    every_member_p95_absolute_error_maximum: 0.05
    ensemble_maximum_absolute_error_maximum: 0.10
    ensemble_p95_absolute_error_maximum: 0.05
    ensemble_absolute_bias_maximum: 0.01
  material_improvement:
    worst_member_maximum_error_ratio_to_original_ptq_maximum: 0.50
    ensemble_p95_error_ratio_to_original_ptq_p95: 0.75
  decision_contract:
    threshold_crossing_exact: true
    persistence_exact: true
    reflex_onset_exact: true
  recurrent_diagnostics:
    - first_projection_error
    - hidden_error_by_timestep
    - timestep_19_hidden_error
    - classifier_logit_error
  all_three_seeds_required: true

