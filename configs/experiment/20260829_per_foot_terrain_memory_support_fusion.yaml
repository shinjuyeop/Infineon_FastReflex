  foot_id_in_model_tensor: false
  training_split: train
  validation_split: validation
  max_events_per_run_class: 2
  seeds: [17, 29, 43]
  batch_size: 64
  max_epochs: 40
  patience: 6
  learning_rate: 0.001
  normalization: per_channel_zscore_train_events_only
  parity_tolerance: 1.0e-12
  expected_validation:
