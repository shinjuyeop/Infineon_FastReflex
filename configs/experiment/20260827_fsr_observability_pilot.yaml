early_target:
  sink: retrospectively_qualified_physical_t1_to_t3
  slip: established_t1_to_t3
  benign: valid_pre_censor_as_normal
  hazard_stable_prefix: run_start_to_t0
  transition_t0_to_t1: excluded
  raw_annotations_modified: false

split:
  source: artifacts/runs/20260827_first_classification_poc/split.json
  frozen_before_sensor_analysis: true
  train: [normal_concrete_s015_p000, normal_concrete_s020_p000, normal_marble_s010_p000, normal_marble_s015_p000, normal_marble_s025_p000, normal_sand_s015_p000, normal_sand_s020_p000, normal_sand_s025_p000, normal_sink_right_mild_s015_p035, normal_sink_left_moderate_s015_p035, slip_ice_s010_p030, slip_ice_s010_p035, slip_ice_s015_p030, slip_ice_s015_p035, slip_ice_s025_p035, sink_left_severe_s015_p035, sink_left_severe_s025_p030, sink_left_severe_s025_p035, sink_right_severe_s015_p030, sink_right_severe_s020_p035]
  validation: [normal_concrete_s010_p000, normal_marble_s020_p000, normal_sink_left_mild_s015_p035, slip_ice_s020_p035, sink_left_severe_s015_p030, sink_right_severe_s015_p035]
  holdout: [normal_concrete_s025_p000, normal_sand_s010_p000, normal_sink_right_moderate_s015_p035, slip_ice_s010_p040, slip_ice_s025_p030, sink_left_severe_s020_p035, sink_right_severe_s025_p035]

windowing:
  primary_ms: 100
  stride_ms: 10
  train_max_windows_per_run_class: 200

training:
  model: mlp
  hidden: [64, 32]
  loss: cross_entropy
  class_weighting: inverse_train_window_frequency
  optimizer: adam
  learning_rate: 0.001
  batch_size: 128
  max_epochs: 40
  early_stopping_patience: 6
  seeds: [20260827, 20260828, 20260829]

replay:
  stride_ms: 1
  sustained_ms: 10
  horizons_ms: [20, 30, 50, 100]
  decision: argmax

artifacts:
  path: artifacts/runs/20260827_fsr_observability_pilot
  gitignored: true
