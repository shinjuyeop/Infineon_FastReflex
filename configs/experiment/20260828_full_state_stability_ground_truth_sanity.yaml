      - com_linear_velocity_y_m_s
      - com_linear_velocity_z_m_s
      - com_height_above_support_m

stable_fit:
  observed_stable_only: true
  fall_runs_excluded: true
  sample_stride_ms: 10
  per_run_per_phase_cap: 256
  cap_selection: evenly_spaced_over_stride_eligible_samples
  normalization: phase_candidate_stable_mean_std
  standard_deviation_floor: 1.0e-8
  covariance: sample_covariance_in_normalized_space
  covariance_regularization:
    method: shrink_off_diagonal_plus_epsilon_identity
    lambda: 0.05
    epsilon: 1.0e-6
  distance: regularized_mahalanobis
  phase_threshold_quantile: 0.995
  quantile_method: linear
  persistence_ms: 20
  transition_gate: first_exact_target_contact
  pretransition_abnormal: diagnostic_false_instability

calibration:
  label: CANDIDATE CALIBRATION
  hard_stable_run_ids:
    - cal_concrete_s015
    - cal_concrete_s020
    - cal_concrete_s025
    - cal_marble_s015
    - cal_marble_s020
    - cal_marble_s025
  transition_run_ids:
    - cal_c_ice_s01
    - cal_c_ice_s02
    - cal_c_ice_s03
    - cal_c_ice_f01
    - cal_c_ice_f02
    - cal_c_ice_f03
    - cal_c_ice_f04
    - cal_c_sand_s01
    - cal_c_sand_s02
    - cal_c_sand_s03
    - cal_c_sand_s04
    - cal_c_sand_f01
    - cal_c_sand_f02
    - cal_c_sand_f03
    - cal_c_sand_f04
    - cal_m_ice_01
    - cal_m_ice_02
    - cal_m_ice_03
    - cal_m_ice_04
    - cal_m_ice_05
    - cal_m_ice_06
    - cal_m_ice_07
    - cal_m_sand_s01
    - cal_m_sand_s02
    - cal_m_sand_s03
    - cal_m_sand_s04
    - cal_m_sand_f01
    - cal_m_sand_f02
    - cal_m_sand_f03
    - cal_m_sand_f04
  qualification:
    stable_false_instability_run_rate_max: 0.10
    fall_prefall_coverage_min: 0.80
    ice_fall_coverage_min: 0.75
    sand_fall_coverage_min: 0.75
    median_fall_lead_ms_min: 200
  selection_priority: [stable_false_instability, overall_fall_coverage, sand_fall_coverage, ice_fall_coverage, median_fall_lead, simplicity]
  near_tie:
    stable_false_instability_percentage_points_max: 5
    fall_coverage_percentage_points_max: 5
    simplicity_order: [PELVIS_STATE, LOWER_BODY_STATE, FULL_STATE]

frozen_operating_domains:
  ice_stable: {speed_mps: [0.25], patch_start_x_m: [0.36], patch_width_m: [0.70, 0.75], slip_pattern: transition, sink_pattern: uniform, sink_severity: moderate, support_pattern: balanced_soft}
