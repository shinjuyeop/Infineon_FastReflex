target_semantics:
  primary_hazard_target:
    definition: established_Slip_OR_established_Support
    Slip: {observable: touchdown_anchor_tangential_drift_m, threshold_m: 0.050, persistence_ms: 3, aggregation: any_foot}
    Support: {observable: support_surface_spread_m, threshold_m: 0.010, persistence_ms: 20, reset: contact_episode_change_or_fall_censor}
    Support_I1: {role: privileged_acceptable_alert_boundary, observable: positive_loaded_foot_spread_derivative_1ms, threshold: 0.0, persistence_ms: 20}
    Terrain_or_design_intent_defines_label: false
    actual_physical_outcome_overrides_intent: true
  ice_precursor:
    name: ICE_PRECURSOR_CANDIDATE
    definition: exact_Ice_AND_loaded_contact_AND_drift_in_30_to_50mm_AND_established_Slip_not_active
    established_Slip: false
    future_outcomes: [SAME_EPISODE_SLIP, NEXT_EPISODE_SLIP, LATER_SLIP, BENIGN_RELEASE, CENSORED]
    benign_followup_horizon_ms: 1000
    velocity_or_phase_threshold_added: false
  required_run_fields:
    - primary_hazard_target
    - ice_precursor_candidate
    - ice_precursor_future_outcome
    - ice_precursor_censored
  required_episode_metadata:
    - episode_boundaries
    - first_30mm_crossing
    - maximum_pre_slip_drift
    - tangential_velocity_diagnostic
    - contact_phase_diagnostic
    - same_next_or_later_Slip
    - benign_release
    - censor
    - time_to_established_Slip
  extraction_policy:
    first_primary_model: same_binary_Hazard_target_as_V1
    established_Slip_positive_window_ms: [-30, 40]
    Support_positive_window: I1_through_established_Support_plus_50ms
    future_Slip_30_to_50mm_region:
      primary_timeline: unchanged
      explicit_positive_relabel: false
      ordinary_negative_sampling: masked
      hard_negative_mining: prohibited
      separately_annotated_pool: true
    fully_observed_benign_release:
      primary_Hazard: negative
      precursor_target: negative
      hard_negative_candidate: true
    censored_precursor:
      confirmed_negative: false
      outcome_supervised_loss: excluded_or_predeclared_down_weighted
      hard_negative_mining: prohibited
    auxiliary_head_in_first_V2_experiment: false

