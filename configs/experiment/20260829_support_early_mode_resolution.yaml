      source_split: train
      phase_equal: true
      support_foot_equal: true
      touchdown_age_tolerance_ms: 50
      maximum_matches_per_alert: 32
  physical_envelope:
    fit_split: train_only
    quantile: 0.995
    phase_conditioned: true
    future_outcome_used: false
    persistence_ms: 20
    metrics:
      - support_surface_spread_m
      - support_surface_max_displacement_m
      - spread_delta_1ms_m
      - spread_delta_5ms_m
      - spread_delta_10ms_m
      - spread_delta_20ms_m
      - spread_delta_50ms_m
      - fsr_left_total_n
      - fsr_right_total_n
      - fsr_bilateral_imbalance
  classification:
