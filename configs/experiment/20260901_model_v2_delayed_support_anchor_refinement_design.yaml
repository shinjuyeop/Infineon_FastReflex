primary_hypothesis: >-
  Complete delayed-Support representation was useful, but dense Support-local
  positive exposure includes Pelvis-IMU states that partially overlap physically
  benign Sand. A smaller anchor policy may retain I1-to-Support temporal learning
  while reducing that overlap.

